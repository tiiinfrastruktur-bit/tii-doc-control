<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TII Document Control Center</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#12281F" />
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js" defer></script>
<style>
:root{
  --bg:#FAF7EF; --bg-card:#FFFFFF; --bg-card-2:#FFFDF7;
  --ink:#15271E; --ink-soft:#12281F;
  --sidebar-1:#123626; --sidebar-2:#0C2A1C;
  --hairline:rgba(18,40,28,0.12); --hairline-soft:rgba(18,40,28,0.07);
  --gold:#D9A536; --gold-bright:#F0C55E; --gold-deep:#B9862A;
  --emerald:#12A971; --emerald-bright:#22D98F;
  --amber:#F2994A; --steel:#3E8FD0; --crimson:#E4574B;
  --muted:#6E7F73; --muted-2:#8FA69B;
  font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);height:100%;}
h1,h2,h3{font-family:Georgia,'Fraunces',serif;margin:0;font-weight:700;letter-spacing:0.005em;}
p{margin:0;}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--gold-bright);color:var(--ink-soft);}

#app{display:flex;min-height:100vh;}

/* sidebar */
.sidebar{width:246px;flex-shrink:0;background:linear-gradient(180deg,var(--sidebar-1),var(--sidebar-2) 75%);
  color:#EFF5EF;border-right:1px solid rgba(240,197,94,0.18);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 18px;border-bottom:1px solid rgba(240,197,94,0.14);margin-bottom:14px;}
.seal{width:38px;height:38px;border-radius:50%;border:1.6px solid var(--gold-bright);display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-weight:700;font-size:13px;color:var(--gold-bright);flex-shrink:0;
  background:radial-gradient(circle at 30% 25%,rgba(240,197,94,0.25),transparent 70%);}
.seal.small{width:30px;height:30px;font-size:11px;}
.brand-title{font-family:Georgia,serif;font-size:13.5px;font-weight:700;line-height:1.25;}
.brand-sub{font-size:10px;color:#B9CFC2;letter-spacing:0.05em;text-transform:uppercase;margin-top:2px;}
.nav{display:flex;flex-direction:column;gap:3px;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:9px;border:none;background:transparent;
  color:#C3D6CB;font-size:13px;font-weight:600;text-align:left;}
.nav-item:hover{background:rgba(240,197,94,0.08);color:#fff;}
.nav-item.active{background:rgba(240,197,94,0.16);color:var(--gold-bright);box-shadow:inset 3px 0 0 var(--gold-bright);}
.nav-ico{width:16px;text-align:center;}
.sidebar-foot{padding-top:12px;border-top:1px solid rgba(240,197,94,0.14);display:flex;flex-direction:column;gap:8px;}
.lockbtn,.gearbtn{width:100%;display:flex;align-items:center;gap:8px;justify-content:center;padding:9px 10px;border-radius:8px;
  border:1px solid rgba(240,197,94,0.22);background:rgba(255,255,255,0.03);color:#C3D6CB;font-size:12px;font-weight:600;}
.lockbtn:hover,.gearbtn:hover{color:var(--gold-bright);border-color:var(--gold-bright);}

/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--hairline);background:var(--bg-card);}
.status-pill{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;}
.status-online{background:rgba(18,169,113,0.14);color:var(--emerald);}
.status-offline{background:rgba(228,87,75,0.14);color:var(--crimson);}
.status-synced{background:rgba(18,169,113,0.14);color:#0A5C3E;}
.status-notsynced{background:rgba(242,153,74,0.16);color:#8A5215;}
.status-local{background:var(--hairline-soft);color:var(--muted);}
.queue-badge{background:rgba(217,165,54,0.16);color:var(--gold-deep);font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;}
.header-search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--hairline);
  border-radius:10px;padding:9px 13px;color:var(--muted);}
.header-search input{background:transparent;border:none;outline:none;color:var(--ink);font-size:13px;width:100%;}
.lang-toggle,.gear-top{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--hairline);color:var(--gold-deep);
  padding:9px 13px;border-radius:9px;font-size:12px;font-weight:700;}
.lang-toggle:hover,.gear-top:hover{border-color:var(--gold);}

.content{flex:1;overflow-y:auto;padding:26px 30px 50px;}
.fade-in{animation:fadeIn 0.3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.hero{margin-bottom:24px;}
.hero-eyebrow{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:8px;font-weight:700;}
.hero h1{font-size:28px;color:var(--ink);margin-bottom:8px;}
.hero p{color:var(--muted);font-size:14px;max-width:580px;line-height:1.55;}
.page-head{margin-bottom:18px;}
.page-head h1{font-size:22px;}
.lead{color:var(--muted);font-size:13.5px;margin-bottom:20px;max-width:640px;line-height:1.5;}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.stat-card{background:var(--bg-card);border:1px solid var(--hairline);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(18,40,28,0.04);}
.stat-num{font-family:Georgia,serif;font-size:27px;font-weight:700;color:var(--ink);margin-top:6px;}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;}

.two-col{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-bottom:22px;}
.panel{background:var(--bg-card);border:1px solid var(--hairline);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(18,40,28,0.04);}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.panel-head h2{font-size:15px;}
.link-btn{background:none;border:none;color:var(--gold-deep);font-size:12px;font-weight:700;}

.level-row{display:grid;grid-template-columns:26px 1fr 3fr 24px;align-items:center;gap:10px;margin-bottom:12px;}
.level-badge{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--lvl,var(--gold));color:var(--lvl,var(--gold));
  font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-family:monospace;flex-shrink:0;background:#fff;}
.level-name{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.level-bar-track{height:7px;border-radius:4px;background:var(--hairline-soft);overflow:hidden;}
.level-bar-fill{height:100%;border-radius:4px;}
.level-count{font-size:12px;color:var(--muted);text-align:right;font-family:monospace;}

.activity-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
.act-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;}
.act-upload{background:rgba(18,169,113,0.14);color:var(--emerald);}
.act-download{background:rgba(217,165,54,0.16);color:var(--gold-deep);}
.activity-title{font-size:12.5px;color:var(--ink);}
.activity-meta{font-size:11px;color:var(--muted);margin-top:2px;}

.plaque-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;}
.plaque-grid.large{grid-template-columns:repeat(auto-fill,minmax(205px,1fr));}
.plaque{background:linear-gradient(155deg,#FFFDF6,#FFFFFF);border:1px solid var(--hairline);border-radius:14px;padding:16px;text-align:left;
  color:var(--ink);display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 3px rgba(18,40,28,0.05);}
.plaque:hover{border-color:var(--gold);transform:translateY(-2px);}
.plaque-code{font-family:monospace;font-size:11px;color:var(--gold-deep);letter-spacing:0.06em;font-weight:700;}
.plaque-name{font-family:Georgia,serif;font-size:15px;font-weight:700;line-height:1.25;}
.plaque-count{font-size:11.5px;color:var(--muted);}
.plaque-cta{margin-top:6px;font-size:11.5px;color:var(--emerald);font-weight:700;}

.pill-filters{display:flex;gap:6px;flex-wrap:wrap;}
.pill{padding:7px 13px;border-radius:999px;border:1px solid var(--hairline);background:var(--bg-card);color:var(--muted);font-size:12px;font-weight:700;}
.pill.active{background:var(--gold);color:#2A1C05;border-color:var(--gold);}

.plate{font-family:monospace;font-size:11px;background:linear-gradient(160deg,#FBF3DE,#F5E7C4);border:1px solid rgba(217,165,54,0.4);
  color:#7A5A16;padding:4px 8px;border-radius:6px;display:inline-block;font-weight:700;}

.doc-table{border:1px solid var(--hairline);border-radius:14px;overflow:hidden;background:var(--bg-card);}
.doc-table-head,.doc-row{display:grid;grid-template-columns:1.4fr 2fr 1.1fr 1fr 100px;gap:12px;padding:12px 14px;align-items:center;}
.doc-table-head.nodept,.doc-row.nodept{grid-template-columns:1.4fr 2.3fr 1fr 100px;}
.doc-table-head{background:#FBF8F0;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);font-weight:700;}
.doc-row{border-top:1px solid var(--hairline-soft);font-size:13px;}
.doc-row:hover{background:#FDFBF4;}
.doc-title-cell{color:var(--ink);}
.muted-cell{color:var(--muted);font-size:12px;}
.tiny{font-size:10.5px;color:var(--muted-2);}
.right{text-align:right;}
.actions{display:flex;justify-content:flex-end;gap:4px;}
.icon-btn{background:var(--bg-card);border:1px solid var(--hairline);color:var(--ink);width:28px;height:28px;border-radius:7px;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;}
.icon-btn:hover{border-color:var(--gold);color:var(--gold-deep);}
.icon-btn.danger:hover{border-color:var(--crimson);color:var(--crimson);}

.search-box-lg{display:flex;align-items:center;gap:10px;background:var(--bg-card);border:1px solid var(--hairline);border-radius:12px;
  padding:13px 16px;margin-bottom:18px;color:var(--muted);}
.search-box-lg input{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font-size:14px;}
.result-count{font-size:12px;color:var(--muted);margin-bottom:12px;}
.empty-state{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--muted);padding:50px 20px;
  border:1.5px dashed var(--hairline);border-radius:14px;background:var(--bg-card);}
.empty-state h3{color:var(--ink);font-size:15px;}
.empty-state p{font-size:12.5px;max-width:320px;}

.form-card{background:var(--bg-card);border:1px solid var(--hairline);border-radius:14px;padding:22px;max-width:640px;
  display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 3px rgba(18,40,28,0.05);}
.form-card.narrow{max-width:380px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-group label{font-size:12px;color:var(--muted);font-weight:700;}
.req{color:var(--crimson);font-weight:700;}
.form-group input,.form-group select,.form-group textarea{background:var(--bg);border:1px solid var(--hairline);border-radius:9px;
  padding:10px 12px;color:var(--ink);font-size:13px;outline:none;resize:vertical;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold);}
.hint{font-size:11px;color:var(--muted-2);}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:4px;}

.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 17px;border-radius:9px;font-size:13px;font-weight:700;border:1px solid transparent;}
.btn-primary{background:linear-gradient(160deg,var(--gold-bright),var(--gold));color:#2A1C05;}
.btn-primary:hover{filter:brightness(1.05);}
.btn-ghost{background:transparent;border-color:var(--hairline);color:var(--muted);}
.btn-ghost:hover{color:var(--ink);border-color:var(--gold);}
.btn-danger{background:var(--crimson);color:#fff;}

.preview-box{background:#FFFBEF;border:1.5px dashed var(--gold);border-radius:11px;padding:13px 15px;display:flex;flex-direction:column;gap:6px;}
.preview-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--gold-deep);font-weight:700;}
.preview-hint{font-size:10.5px;color:var(--muted-2);}

.success-banner{display:flex;align-items:center;gap:12px;background:rgba(18,169,113,0.1);border:1px solid var(--emerald);
  color:#0A5C3E;padding:12px 14px;border-radius:12px;margin-bottom:16px;max-width:640px;}
.success-banner strong{color:var(--ink);display:block;margin-bottom:4px;font-size:12.5px;}

.hist-table{border:1px solid var(--hairline);border-radius:14px;overflow:hidden;background:var(--bg-card);}
.hist-table-head,.hist-row{display:grid;grid-template-columns:150px 110px 2fr 1.2fr 90px;gap:12px;padding:11px 14px;align-items:center;}
.hist-table-head{background:#FBF8F0;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);font-weight:700;}
.hist-row{border-top:1px solid var(--hairline-soft);font-size:12.5px;}
.hist-row:hover{background:#FDFBF4;}
.act-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;width:fit-content;}
.act-chip.act-upload{background:rgba(18,169,113,0.14);color:#0A5C3E;}
.act-chip.act-download{background:rgba(217,165,54,0.16);color:var(--gold-deep);}

.modal-overlay{position:fixed;inset:0;background:rgba(18,40,28,0.45);backdrop-filter:blur(2px);display:flex;align-items:center;
  justify-content:center;z-index:200;padding:20px;}
.modal{background:var(--bg-card);border:1px solid var(--hairline);border-radius:16px;padding:22px;width:100%;max-width:400px;animation:fadeIn 0.2s ease;}
.modal.wide{max-width:520px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.modal-head h3{font-size:15px;display:flex;align-items:center;gap:8px;}
.modal-sub{font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
.doc-summary{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--hairline);border-radius:9px;
  padding:10px 12px;margin-bottom:14px;font-size:12.5px;}
.modal form{display:flex;flex-direction:column;gap:12px;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:11px 18px;
  border-radius:10px;font-size:12.5px;font-weight:700;z-index:300;box-shadow:0 10px 26px rgba(18,40,28,0.25);}
.toast-success{background:var(--emerald);color:#fff;}
.toast-error{background:var(--crimson);color:#fff;}
.toast-info{background:var(--ink-soft);color:#F0C55E;}

.brand-logo{width:38px;height:38px;object-fit:contain;flex-shrink:0;}
.tiny-footer{position:fixed;bottom:2px;left:50%;transform:translateX(-50%);font-size:5px;line-height:1;color:rgba(0,0,0,0.55);
  letter-spacing:0.01em;z-index:5;pointer-events:none;user-select:none;white-space:nowrap;}

@media (max-width:860px){
  #app{flex-direction:column;}
  .sidebar{width:100%;height:auto;flex-direction:row;align-items:center;position:static;overflow-x:auto;}
  .brand{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .nav{flex-direction:row;}
  .sidebar-foot{border-top:none;padding-top:0;margin-left:auto;flex-direction:row;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .two-col{grid-template-columns:1fr;}
  .form-row{grid-template-columns:1fr;}
  .doc-table-head,.doc-row,.hist-table-head,.hist-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================== REFERENCE DATA ============================== */
const DEPARTMENTS=[
 {id:'management',code:'PJO',en:'PJO',id_:'PJO'},
 {id:'engineering',code:'ENG',en:'Engineering',id_:'Engineering'},
 {id:'hse',code:'OHSE',en:'HSE',id_:'HSE'},
 {id:'training',code:'TND',en:'Training & Development',id_:'Training & Development'},
 {id:'hauling',code:'HLG',en:'Hauling Operations',id_:'Hauling Operations'},
 {id:'finance',code:'Proc',en:'Finance & Procurement',id_:'Finance & Procurement'},
 {id:'maintenance',code:'MTC',en:'Maintenance Plant',id_:'Maintenance Plant'},
 {id:'hrga',code:'HRGA',en:'HRGA',id_:'HRGA'},
];
const DOC_TYPES=[
 {id:'manual',level:1,roman:'I',code:'MAN',en:'Manual / Handbook',id_:'Manual / Handbook'},
 {id:'sop',level:2,roman:'II',code:'SOP',en:'SOP',id_:'SOP'},
 {id:'prosedur',level:2,roman:'II',code:'PSD',en:'Procedure',id_:'Prosedur'},
 {id:'ik',level:3,roman:'III',code:'IK',en:'Work Instruction (IK)',id_:'Instruksi Kerja (IK)'},
 {id:'standar',level:3,roman:'III',code:'SP',en:'Standard Parameter',id_:'Standar Parameter'},
 {id:'form',level:4,roman:'IV',code:'FRM',en:'Form',id_:'Form'},
 {id:'jsea',level:4,roman:'IV',code:'JSEA',en:'JSEA',id_:'JSEA'},
 {id:'ibpr',level:4,roman:'IV',code:'IBPR',en:'IBPR (HIRADC)',id_:'IBPR (HIRADC)'},
 {id:'other',level:4,roman:'IV',code:'LN',en:'Other',id_:'Lainnya'},
];
const LEVEL_META={
 1:{roman:'I',color:'var(--gold)',en:'Level I · Manual',id_:'Level I · Manual'},
 2:{roman:'II',color:'var(--emerald)',en:'Level II · Procedure',id_:'Level II · Prosedur'},
 3:{roman:'III',color:'var(--amber)',en:'Level III · Work Instruction',id_:'Level III · Instruksi Kerja'},
 4:{roman:'IV',color:'var(--steel)',en:'Level IV · Form/JSEA/IBPR',id_:'Level IV · Form/JSEA/IBPR'},
};
const DEFAULT_KEYCODE='ADMIN2026';
// Baked-in default backend URL so every device that opens this file connects
// to the shared Google Apps Script + Sheets/Drive backend automatically —
// no manual setup needed per device. Leave as '' to make every device start

const pad3=n=>String(n).padStart(3,'0');
const deptById=id=>DEPARTMENTS.find(d=>d.id===id);
const typeById=id=>DOC_TYPES.find(d=>d.id===id);
const genNumber=(deptCode,type,seq)=>`TII/${type.roman}/${deptCode}-SCM/${type.code}/${pad3(seq)}`;
function extractSeq(docNumber){
  const m=String(docNumber||'').match(/\/(\d+)\s*$/);
  return m?parseInt(m[1],10):0;
}
function nextSeqFor(deptId,docTypeId,excludeId){
  let max=0;
  state.documents.forEach(d=>{
    if(d.deptId===deptId && d.docTypeId===docTypeId && d.id!==excludeId){
      const n=extractSeq(d.docNumber);
      if(n>max) max=n;
    }
  });
  return max+1;
}
const fmtDate=(iso,lang)=>{try{return new Date(iso).toLocaleDateString(lang==='id'?'id-ID':'en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch{return iso;}};
const fmtDateTime=(iso,lang)=>{try{return new Date(iso).toLocaleString(lang==='id'?'id-ID':'en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch{return iso;}};
const daysAgoISO=d=>new Date(Date.now()-d*86400000).toISOString();
const uid=p=>`${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============================== INDEXEDDB ============================== */
let __idbPromise=null;
function idb(){
  if(__idbPromise) return __idbPromise;
  __idbPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open('tii-doc-control-db',1);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains('documents')) db.createObjectStore('documents',{keyPath:'id'});
      if(!db.objectStoreNames.contains('history')) db.createObjectStore('history',{keyPath:'id'});
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'key'});
      if(!db.objectStoreNames.contains('queue')) db.createObjectStore('queue',{keyPath:'qid',autoIncrement:true});
      if(!db.objectStoreNames.contains('files')) db.createObjectStore('files',{keyPath:'docId'});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  return __idbPromise;
}
async function storeGetAll(name){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(name,'readonly');const r=t.objectStore(name).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function storePutAll(name,arr){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(name,'readwrite');const st=t.objectStore(name);st.clear();(arr||[]).forEach(i=>st.put(i));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function storePut(name,item){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(name,'readwrite');t.objectStore(name).put(item);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function storeAdd(name,item){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(name,'readwrite');const r=t.objectStore(name).add(item);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function storeDelete(name,key){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(name,'readwrite');t.objectStore(name).delete(key);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function storeGet(name,key){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(name,'readonly');const r=t.objectStore(name).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function getMeta(key,fallback){try{const r=await storeGet('meta',key);return r?r.value:fallback;}catch{return fallback;}}
async function setMeta(key,value){await storePut('meta',{key,value});}

/* ============================== API LAYER ============================== */
async function apiGet(action,params={}){
  if(!state.apiUrl) throw new Error('no-url');
  const qs=new URLSearchParams({action,...params}).toString();
  const res=await fetch(`${state.apiUrl}?${qs}`);
  if(!res.ok) throw new Error('bad-response');
  return res.json();
}
async function apiPost(action,payload){
  if(!state.apiUrl) throw new Error('no-url');
  const res=await fetch(state.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,payload})});
  if(!res.ok) throw new Error('bad-response');
  const data=await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}
async function enqueue(action,payload){
  await storeAdd('queue',{action,payload,ts:Date.now()});
  state.queueCount=(await storeGetAll('queue')).length;
}
async function flushQueue(){
  if(!state.apiUrl || !navigator.onLine) return;
  const items=await storeGetAll('queue');
  items.sort((a,b)=>a.qid-b.qid);
  for(const item of items){
    try{
      await apiPost(item.action,item.payload);
      await storeDelete('queue',item.qid);
    }catch(e){ break; }
  }
  state.queueCount=(await storeGetAll('queue')).length;
}

async function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

/* ============================== DATA LOAD ============================== */
async function loadData(){
  const savedApiUrl=await getMeta('apiUrl',null);
  if(savedApiUrl===null){
    // First time this device opens the app — adopt the baked-in shared backend automatically.
    state.apiUrl=DEFAULT_API_URL;
    await setMeta('apiUrl',state.apiUrl);
  } else {
    state.apiUrl=savedApiUrl;
  }
  state.online=navigator.onLine;
  state.lastSyncedAt=await getMeta('lastSyncedAt',null);
  if(state.apiUrl && state.online){
    try{
      const data=await apiGet('bootstrap');
      state.documents=(data.documents||[]).map(normalizeDoc);
      state.history=data.history||[];
      state.keycode=(data.config&&data.config.keycode)||DEFAULT_KEYCODE;
      state.counters=(data.config&&data.config.counters)||{};
      await storePutAll('documents',state.documents);
      await storePutAll('history',state.history);
      await setMeta('keycode',state.keycode);
      await setMeta('counters',state.counters);
      state.dataSource='server';
      state.lastSyncedAt=new Date().toISOString();
      await setMeta('lastSyncedAt',state.lastSyncedAt);
    }catch(e){ await loadFromCache(); }
  } else {
    await loadFromCache();
  }
  state.queueCount=(await storeGetAll('queue')).length;
}
function normalizeDoc(d){
  return {...d, hasFile: d.hasFile===true||d.hasFile==='TRUE'||d.hasFile==='true', level:Number(d.level)};
}
async function loadFromCache(){
  state.documents=await storeGetAll('documents');
  state.history=await storeGetAll('history');
  state.keycode=await getMeta('keycode',DEFAULT_KEYCODE);
  state.counters=await getMeta('counters',{});
  if(state.documents.length===0 && state.history.length===0){
    const seeded=seedDemo();
    state.documents=seeded.documents; state.counters=seeded.counters; state.history=seeded.history;
    await storePutAll('documents',state.documents);
    await storePutAll('history',state.history);
    await setMeta('counters',state.counters);
  }
  state.dataSource='cache';
}

async function addDocument(form,file){
  const dept=deptById(form.deptId), type=typeById(form.docTypeId);
  const seq=nextSeqFor(form.deptId,form.docTypeId);
  const docNumber=genNumber(dept.code,type,seq);
  const docId=uid('doc');
  const doc={id:docId,docNumber,title:form.title,titleId:form.title,deptId:form.deptId,docTypeId:form.docTypeId,level:type.level,
    uploaderName:form.uploaderName,uploaderPosition:form.uploaderPosition,description:form.description||'',
    hasFile:!!file,fileId:'',fileName:file?file.name:null,createdAt:new Date().toISOString()};

  state.documents=[doc,...state.documents];
  await storePut('documents',doc);

  const log={id:uid('h'),type:'upload',docId,docNumber,docTitle:form.title,personName:form.uploaderName,
    personPosition:form.uploaderPosition,personDept:form.deptId,timestamp:doc.createdAt};
  state.history=[log,...state.history];
  await storePut('history',log);

  if(file){
    const base64=await fileToBase64(file);
    await storePut('files',{docId,name:file.name,mimeType:file.type,base64});
  }

  if(state.apiUrl && state.online){
    try{
      await apiPost('addDocument',doc);
      await apiPost('addHistory',log);
      if(file){
        const base64=await fileToBase64(file);
        const up=await apiPost('uploadFile',{docId,name:file.name,mimeType:file.type,base64});
        doc.fileId=up.fileId;
        await apiPost('updateDocument',{id:docId,fileId:up.fileId,fileName:file.name,hasFile:'TRUE'});
        await storePut('documents',doc);
      }
    }catch(e){
      await enqueue('addDocument',doc);
      await enqueue('addHistory',log);
      if(file){ const base64=await fileToBase64(file); await enqueue('uploadFile',{docId,name:file.name,mimeType:file.type,base64}); }
    }
  } else {
    await enqueue('addDocument',doc);
    await enqueue('addHistory',log);
    if(file){ const base64=await fileToBase64(file); await enqueue('uploadFile',{docId,name:file.name,mimeType:file.type,base64}); }
  }
  state.queueCount=(await storeGetAll('queue')).length;
  return doc;
}

async function confirmDownload(doc,person){
  const log={id:uid('h'),type:'download',docId:doc.id,docNumber:doc.docNumber,docTitle:doc.title,
    personName:person.name,personPosition:person.position,personDept:person.deptId,timestamp:new Date().toISOString()};
  state.history=[log,...state.history];
  await storePut('history',log);
  if(state.apiUrl && state.online){ try{ await apiPost('addHistory',log); }catch(e){ await enqueue('addHistory',log); } }
  else { await enqueue('addHistory',log); }
  state.queueCount=(await storeGetAll('queue')).length;

  let fileData=await storeGet('files',doc.id);
  if(!fileData && doc.hasFile && doc.fileId && state.apiUrl && state.online){
    try{
      const res=await apiGet('getFile',{fileId:doc.fileId});
      fileData={docId:doc.id,name:res.name,mimeType:res.mimeType,base64:res.base64};
      await storePut('files',fileData);
    }catch(e){}
  }
  if(fileData){
    const a=document.createElement('a');
    a.href=fileData.base64; a.download=fileData.name||`${doc.docNumber.replace(/\//g,'-')}`;
    document.body.appendChild(a); a.click(); a.remove();
    return true;
  }
  return false;
}

async function editDocument(updated){
  state.documents=state.documents.map(d=>d.id===updated.id?{...d,...updated}:d);
  await storePut('documents',state.documents.find(d=>d.id===updated.id));
  if(state.apiUrl && state.online){ try{ await apiPost('updateDocument',updated); }catch(e){ await enqueue('updateDocument',updated); } }
  else { await enqueue('updateDocument',updated); }
  state.queueCount=(await storeGetAll('queue')).length;
}
async function deleteDocument(doc){
  state.documents=state.documents.filter(d=>d.id!==doc.id);
  await storeDelete('documents',doc.id);
  if(state.apiUrl && state.online){ try{ await apiPost('deleteDocument',{id:doc.id}); }catch(e){ await enqueue('deleteDocument',{id:doc.id}); } }
  else { await enqueue('deleteDocument',{id:doc.id}); }
  state.queueCount=(await storeGetAll('queue')).length;
}
async function changeKeycode(current,next){
  if(current!==state.keycode) return false;
  state.keycode=next;
  await setMeta('keycode',next);
  if(state.apiUrl && state.online){ try{ await apiPost('updateKeycode',{current,next}); }catch(e){ await enqueue('updateKeycode',{current,next}); } }
  else { await enqueue('updateKeycode',{current,next}); }
  state.queueCount=(await storeGetAll('queue')).length;
  return true;
}
async function saveApiUrl(url){
  state.apiUrl=url.trim();
  await setMeta('apiUrl',state.apiUrl);
  await loadData();
}

function renderDepartments(){

function renderDeptDetail(){
  const T_=t(); const dept=deptById(state.selectedDept);
  if(!dept) return renderDepartments();
  let docs=state.documents.filter(d=>d.deptId===dept.id);
  if(state.deptLevelFilter!=='all') docs=docs.filter(d=>d.level===Number(state.deptLevelFilter));
  docs=docs.sort((a,b)=>a.level-b.level||new Date(b.createdAt)-new Date(a.createdAt));
  return `<div class="view fade-in">
    <button class="link-btn" data-action="nav" data-view="departments" style="margin-bottom:14px;">\u2039 ${T_.backToDepartments}</button>
    <div class="page-head">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;"><div class="seal small" style="border-color:var(--gold-deep);color:var(--gold-deep)">${dept.code}</div>
      <h1>${state.lang==='id'?dept.id_:dept.en}</h1></div>
      <div class="pill-filters">
        <button class="pill ${state.deptLevelFilter==='all'?'active':''}" data-action="dept-filter" data-level="all">${T_.allLevels}</button>
        ${[1,2,3,4].map(l=>`<button class="pill ${state.deptLevelFilter===String(l)?'active':''}" data-action="dept-filter" data-level="${l}">${LEVEL_META[l].roman}</button>`).join('')}

}

function renderSearch(){
  const T_=t();
  const q=state.searchQuery.trim().toLowerCase();
  const results=q?state.documents.filter(d=>docTitleFor(d).toLowerCase().includes(q)||d.docNumber.toLowerCase().includes(q)):[];
  return `<div class="view fade-in"><div class="page-head"><h1>${T_.navSearch}</h1></div>
    <form class="search-box-lg" data-form="search-box"><span>\u2315</span><input name="q" autofocus placeholder="${T_.searchPlaceholder}" value="${esc(state.searchQuery)}" /></form>
    ${q===''?`<div class="empty-state"><div style="font-size:26px;">\u2315</div><h3>${T_.searchEmptyTitle}</h3><p>${T_.searchEmptyBody}</p></div>`:
      `<div class="result-count">${results.length} ${T_.searchResults} “${esc(state.searchQuery)}”</div>
       ${results.length===0?`<div class="empty-state"><p>${T_.searchNoMatch}</p></div>`:docTable(results,true)}`}
  </div>`;
}

function docTable(docs,showDept){
  const T_=t();
  if(docs.length===0) return `<div class="empty-state"><p>${T_.noDocuments}</p></div>`;
  const cls=showDept?'':' nodept';
  return `<div class="doc-table">
    <div class="doc-table-head${cls}"><span>${T_.docNumber}</span><span>${T_.title}</span>${showDept?`<span>${T_.department}</span>`:''}<span>${T_.uploadedBy}</span><span>${T_.date}</span><span class="right">${T_.action}</span></div>
    ${docs.map(doc=>`<div class="doc-row${cls}">
      <span>${levelBadge(doc.level)} ${plate(doc.docNumber)}</span>
      <span class="doc-title-cell">${esc(docTitleFor(doc))} ${doc.hasFile?'<span class="tiny">\u{1F4CE}</span>':''}</span>
      ${showDept?`<span>${deptById(doc.deptId).code}</span>`:''}
      <span class="muted-cell">${esc(doc.uploaderName)}<br><span class="tiny">${esc(doc.uploaderPosition)}</span></span>
      <span class="muted-cell">${fmtDate(doc.createdAt,state.lang)}</span>
      <span class="right actions">
        <button class="icon-btn" title="${T_.download}" data-action="open-download" data-id="${doc.id}">\u2193</button>
        ${state.isAdmin?`<button class="icon-btn" title="${T_.edit}" data-action="open-edit" data-id="${doc.id}">\u270E</button>
        <button class="icon-btn danger" title="${T_.delete}" data-action="open-delete" data-id="${doc.id}">\u2715</button>`:''}
      </span></div>`).join('')}
  </div>`;
}

      <button class="icon-btn" data-action="clear-last" style="margin-left:auto;">\u2715</button></div>`:''}
    <form class="form-card" data-form="upload">

        <div class="form-group"><label>${T_.fieldType}</label><select name="docTypeId" id="f-type" data-action="preview-refresh">

function uploadPreview(){
  const deptId=document.getElementById('f-dept')?.value;
  const typeId=document.getElementById('f-type')?.value;
  const slot=document.getElementById('preview-slot');
  if(!slot) return;
  const dept=deptById(deptId), type=typeById(typeId);
  if(!dept||!type){ slot.innerHTML=''; return; }
  const seq=nextSeqFor(deptId,typeId);
  const number=genNumber(dept.code,type,seq);
  slot.innerHTML=`<div class="preview-box"><div class="preview-label">${t().previewLabel}</div>${plate(number)}<div class="preview-hint">${t().previewHint}</div></div>`;
}

  if(m.type==='settings'){

      <div class="modal-head"><h3>\u2699 ${T_.settingsTitle}</h3><button class="icon-btn" data-action="close-modal">\u2715</button></div>

      <div class="modal-head"><h3>\u{1F511} ${T_.adminModalTitle}</h3><button class="icon-btn" data-action="close-modal">\u2715</button></div>

        <div class="form-actions"><button type="button" class="btn btn-ghost" data-action="close-modal">${T_.cancel}</button>
        <button type="submit" class="btn btn-primary">\u{1F513} ${T_.unlock}</button></div></form>

    return `<div class="modal-overlay" data-overlay-close="1"><div class="modal">
      <div class="modal-head"><h3>\u2193 ${T_.downloadModalTitle}</h3><button class="icon-btn" data-action="close-modal">\u2715</button></div>
      <p class="modal-sub">${T_.downloadModalSub}</p>
      <div class="doc-summary">${plate(doc.docNumber)}<div>${esc(docTitleFor(doc))}</div></div>
      <form data-form="download"><div class="form-group"><label>${T_.fieldName}</label><input name="name" autofocus /></div>
        <div class="form-group"><label>${T_.fieldPosition}</label><input name="position" /></div>
        <div class="form-group"><label>${T_.fieldDept}</label><select name="deptId"><option value="">${T_.fieldDeptPh}</option>
          ${DEPARTMENTS.map(d=>`<option value="${d.id}">${d.code} — ${state.lang==='id'?d.id_:d.en}</option>`).join('')}</select></div>
        <div class="form-actions"><button type="button" class="btn btn-ghost" data-action="close-modal">${T_.cancel}</button>
        <button type="submit" class="btn btn-primary">\u2193 ${T_.confirmDownload}</button></div></form>
    </div></div>`;
  }
  if(m.type==='edit'){
    const doc=m.doc;
    return `<div class="modal-overlay" data-overlay-close="1"><div class="modal wide">
      <div class="modal-head"><h3>\u270E ${T_.editDocTitle}</h3><button class="icon-btn" data-action="close-modal">\u2715</button></div>
      <p class="modal-sub">${T_.editDocSub}</p>
      <div class="doc-summary">${levelBadge(doc.level)} ${plate(doc.docNumber)}</div>
      <form data-form="edit" data-id="${doc.id}">
        <div class="form-group"><label>${T_.fieldTitle}</label><input name="title" value="${esc(doc.title)}" /></div>
        <div class="form-row">
          <div class="form-group"><label>${T_.fieldName}</label><input name="uploaderName" value="${esc(doc.uploaderName)}" /></div>
          <div class="form-group"><label>${T_.fieldPosition}</label><input name="uploaderPosition" value="${esc(doc.uploaderPosition)}" /></div>
        </div>
        <div class="form-group"><label>${T_.fieldSeq}</label><input type="number" min="1" name="seq" value="${extractSeq(doc.docNumber)}" />

/* ============================== EXPORT ============================== */
function exportHistoryToExcel(){
  if(typeof XLSX==='undefined'){ showToast(t().exportUnavailable,'error'); return; }
  const T_=t();
  const rows=recentLogs().map(l=>({
    [T_.time]: fmtDateTime(l.timestamp,state.lang),
    [T_.activity]: l.type==='upload'?T_.actUpload:T_.actDownload,
    [T_.docNumber]: l.docNumber,
    [T_.document]: l.docTitle,
    [T_.person]: l.personName,
    [T_.position]: l.personPosition,
    [T_.department]: (deptById(l.personDept)||{}).code||'',
  }));
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:18},{wch:10},{wch:26},{wch:36},{wch:20},{wch:18},{wch:10}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'History');
  const stamp=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb,`TII-History-Log-${stamp}.xlsx`);
}

/* ============================== EVENTS ============================== */
function bindEvents(){
  const app=document.getElementById('app');

  app.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click',async (e)=>{
      const action=el.dataset.action;
      if(action==='nav'){ state.view=el.dataset.view; render(); }
      else if(action==='open-dept'){ state.selectedDept=el.dataset.id; state.deptLevelFilter='all'; state.view='deptDetail'; render(); }
      else if(action==='dept-filter'){ state.deptLevelFilter=el.dataset.level; render(); }
      else if(action==='toggle-lang'){ state.lang=state.lang==='id'?'en':'id'; render(); }
      else if(action==='open-settings'){ state.modal={type:'settings'}; render(); }
      else if(action==='open-admin'){ state.modal={type:'admin'}; render(); }
      else if(action==='lock'){ state.isAdmin=false; if(state.view==='admin') state.view='dashboard'; render(); }
      else if(action==='close-modal'){ state.modal=null; render(); }
      else if(action==='sync-now'){ showToast(t().syncNow,'info'); await flushQueue(); await loadData(); render(); }
      else if(action==='clear-last'){ state.lastGenerated=null; render(); }
      else if(action==='open-download'){ state.modal={type:'download',doc:state.documents.find(d=>d.id===el.dataset.id)}; render(); }
      else if(action==='open-edit'){ state.modal={type:'edit',doc:state.documents.find(d=>d.id===el.dataset.id)}; render(); }
      else if(action==='open-delete'){ state.modal={type:'delete',doc:state.documents.find(d=>d.id===el.dataset.id)}; render(); }
      else if(action==='confirm-delete'){
        const doc=state.documents.find(d=>d.id===el.dataset.id);
        await deleteDocument(doc); state.modal=null; showToast(t().delete); render();
      }
      else if(action==='preview-refresh'){ uploadPreview(); }
      else if(action==='export-excel'){ exportHistoryToExcel(); }
    });
    if(el.tagName==='SELECT' && el.dataset.action==='preview-refresh'){
      el.addEventListener('change',uploadPreview);
    }
  });

  app.querySelectorAll('.modal-overlay').forEach(ov=>{
    ov.addEventListener('mousedown',(e)=>{ if(e.target===ov){ state.modal=null; render(); } });
  });

  app.querySelectorAll('[data-form]').forEach(form=>{
    form.addEventListener('submit',async (e)=>{
      e.preventDefault();
      const type=form.dataset.form;
      const fd=new FormData(form);
      if(type==='header-search'){ state.headerQuery=fd.get('q')||''; state.searchQuery=state.headerQuery; state.view='search'; render(); }
      else if(type==='search-box'){ state.searchQuery=fd.get('q')||''; render(); }
      else if(type==='settings'){ await saveApiUrl(fd.get('url')||''); state.modal=null; showToast(t().saveSettings); render(); }
      else if(type==='unlock'){
        const code=fd.get('code')||'';
        if(code===state.keycode){ state.isAdmin=true; state.modal=null; showToast(t().adminUnlocked); }
        else { showToast(t().wrongKeycode,'error'); }
        render();
      }
      else if(type==='upload'){
        const form_={title:(fd.get('title')||'').trim(),deptId:fd.get('deptId')||'',docTypeId:fd.get('docTypeId')||'',
          uploaderName:(fd.get('uploaderName')||'').trim(),uploaderPosition:(fd.get('uploaderPosition')||'').trim(),
          description:(fd.get('description')||'').trim()};
        if(!form_.title||!form_.deptId||!form_.docTypeId||!form_.uploaderName||!form_.uploaderPosition){
          showToast(t().required,'error'); return;
        }
        const file=fd.get('file'); const realFile=(file&&file.size>0)?file:null;
        const doc=await addDocument(form_,realFile);
        state.lastGenerated=doc;
        showToast(`${t().uploadSuccessTitle}: ${doc.docNumber}`);
        render();
      }
      else if(type==='download'){
        const doc=state.modal.doc;
        const person={name:(fd.get('name')||'').trim(),position:(fd.get('position')||'').trim(),deptId:fd.get('deptId')||''};
        if(!person.name||!person.position||!person.deptId){ showToast(t().required,'error'); return; }
        const ok=await confirmDownload(doc,person);
        state.modal=null;
        showToast(ok?t().confirmDownload:t().noFileAttached, ok?'success':'error');
        render();
      }
      else if(type==='edit'){
        const doc=state.modal.doc;
        const updated={id:doc.id,title:(fd.get('title')||'').trim(),titleId:(fd.get('title')||'').trim(),
          uploaderName:(fd.get('uploaderName')||'').trim(),uploaderPosition:(fd.get('uploaderPosition')||'').trim(),
          description:(fd.get('description')||'').trim()};
        const seqVal=parseInt(fd.get('seq'),10);
        if(seqVal && seqVal!==extractSeq(doc.docNumber)){
          const dept=deptById(doc.deptId), type_=typeById(doc.docTypeId);
          updated.docNumber=genNumber(dept.code,type_,seqVal);
        }
        await editDocument(updated);
        state.modal=null; showToast(t().save); render();
      }
      else if(type==='change-keycode'){
        const current=fd.get('current')||'', next=fd.get('next')||'';
        if(!next.trim()) return;
        const ok=await changeKeycode(current,next.trim());
        showToast(ok?t().keycodeUpdated:t().wrongKeycode, ok?'success':'error');
        form.reset(); render();
      }
    });
  });

  const uf=document.getElementById('f-dept'), ut=document.getElementById('f-type');
  if(uf) uf.addEventListener('change',uploadPreview);
  if(ut) ut.addEventListener('change',uploadPreview);
}

/* ============================== BOOT ============================== */
window.addEventListener('online',async ()=>{ state.online=true; render(); await flushQueue(); await loadData(); render(); });
window.addEventListener('offline',()=>{ state.online=false; render(); });

(async function boot(){
  state.loading=true; render();
  await loadData();
  state.loading=false;
  render();
  if(state.apiUrl && state.online) flushQueue().then(()=>loadData()).then(render);
  if('serviceWorker' in navigator){
    try{ await navigator.serviceWorker.register('./sw.js'); }catch(e){ /* preview sandbox may block this; ignore */ }
  }
})();
